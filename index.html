<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인수분해 매직 랜드 (Factorization Magic Land)</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0a21; 
            --ticket-bg: rgba(255, 255, 255, 0.9); 
            --text-dark: #2c3e50;
            --text-magic: #6a1b9a; 
            --neon-pink: #ff1a7e;
            --neon-cyan: #00e5ff;
            --neon-yellow: #ffea00;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: 
                linear-gradient(rgba(13, 10, 33, 0.6) 0%, rgba(13, 10, 33, 0.8) 100%),
                url('bg_amusement_park.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; 
            
            /* [수정됨] 화면이 작아도 잘리지 않게 설정 */
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; /* 위아래 여백 추가 */
            box-sizing: border-box;
            overflow-y: auto; /* 짤리면 스크롤 가능하게 변경! */
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 650px;
        }

        /* 메인 UI 카드 */
        .screen {
            background: var(--ticket-bg); 
            backdrop-filter: blur(8px);
            border: 3px solid #f8f9fa;
            padding: 50px 40px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            text-align: center;
            animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        /* [수정됨] 처음에는 게임 화면 숨기기 */
        #game-screen {
            display: none;
        }

        .screen::before, .screen::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: var(--bg-color);
            border-radius: 50%;
        }
        .screen::before { top: -15px; left: -15px; }
        .screen::after { top: -15px; right: -15px; }

        @keyframes bounce-in {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .main-title {
            font-family: 'Poppins', 'Pretendard', sans-serif;
            color: var(--text-magic);
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        
        /* 5단계 난이도 버튼 */
        .mode-btn-container {
            display: flex; flex-direction: column; gap: 12px;
        }
        .mode-btn {
            background: white;
            color: var(--text-dark);
            border: 2px solid #e0e0e0;
            padding: 16px; font-size: 1.2rem; font-weight: 700;
            border-radius: 15px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .mode-btn.easy { border-color: #81c784; color: #1b5e20; }
        .mode-btn.normal { border-color: #64b5f6; color: #1565c0; }
        .mode-btn.hard { border-color: #ffb74d; color: #e65100; }
        .mode-btn.master { border-color: #ff8a80; color: #c62828; }
        .mode-btn.grandmaster { 
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-cyan) 100%); 
            color: white; border-color: white; 
        }

        .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        
        /* 수식 영역 */
        #problem { 
            font-family: 'Times New Roman', serif;
            font-size: 3.5rem; 
            font-weight: 700; 
            color: #ffffff; 
            margin: 30px 0; 
            min-height: 100px; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(13, 10, 33, 0.7);
            border-radius: 20px; padding: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        #problem:before, #problem:after { content: '🎪'; font-size: 1.5rem; opacity: 0.5; margin: 0 15px; }

        .controls { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            margin-bottom: 20px;
        }

        .btn-next { 
            background: linear-gradient(135deg, #ff1a7e 0%, #ff5c97 100%); 
            color: white; border: none;
            padding: 16px; font-size: 1.2rem; font-weight: 700; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-next:hover { transform: translateY(-3px); box-shadow: 0 0 15px rgba(255, 26, 126, 0.3); }

        .btn-answer { 
            background: white; color: var(--text-magic); border: 2px solid #c5cae9;
            padding: 16px; font-size: 1.2rem; font-weight: 700; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-answer:hover { background: #f8f9fa; transform: translateY(-3px); border-color: #c5cae9; }

        /* 뒤로가기 버튼 */
        .btn-back {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); 
            color: white; font-size: 0.9rem; padding: 8px 15px; border-radius: 20px;
            cursor: pointer; position: absolute; top: -45px; right: 0;
            transition: all 0.2s; font-weight: 700; backdrop-filter: blur(4px);
        }
        .btn-back:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

        /* 정답 영역 */
        #answer-area { 
            margin-top: 20px; border-top: 2px dashed #e0e0e0; padding-top: 25px; 
            background: white; border-radius: 20px; padding: 20px;
            opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
            display: none; /* 공간 차지 방지 */
        }
        #answer-area.show { opacity: 1; transform: translateY(0); display: block; }

        #type-text { 
            display: inline-block; padding: 6px 14px; 
            background: #e8eaf6; color: var(--text-magic); border-radius: 20px; font-size: 0.9rem; margin-bottom: 10px; font-weight: 700; 
        }
        
        #answer-display { 
            font-family: 'Times New Roman', serif;
            font-size: 2.5rem; color: #e91e63; font-weight: 700; 
        }
        
        .note { color: var(--neon-pink); font-size: 0.85rem; margin-top: 15px; font-weight: 600; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen">
        <div class="main-title">FAIRGROUND<br>FACTORIZE</div>
        <p style="color: #666; margin-bottom: 20px; font-weight: 700;">🎡 난이도를 선택하세요</p>
        <div class="mode-btn-container">
            <button class="mode-btn easy" onclick="startGame('easy')">1단계: 초보자 (기본 이차식)</button>
            <button class="mode-btn normal" onclick="startGame('normal')">2단계: 숙련자 (계수 있는 이차식)</button>
            <button class="mode-btn hard" onclick="startGame('hard')">3단계: 고수 (멜빵법 집중 훈련)</button>
            <button class="mode-btn master" onclick="startGame('master')">4단계: 마스터 (고1 공통인수+합차)</button>
            <button class="mode-btn grandmaster" onclick="startGame('grandmaster')">5단계: 그랜드마스터 (복이차식 변형)</button>
        </div>
    </div>

    <div id="game-screen">
        <button class="btn-back" onclick="goBack()">✖ 나가기</button>
        <div class="screen">
            <div class="main-title" id="game-title">Loading...</div>
            <div id="problem">...</div>
            <div class="controls">
                <button class="btn-next" onclick="generateProblem()">🎡 다음 문제</button>
                <button class="btn-answer" onclick="toggleAnswer()">🎫 정답 확인</button>
            </div>
            
            <div id="answer-area">
                <div id="type-text">유형</div>
                <div id="answer-display">...</div>
                <div class="note">* 마법의 주문: 항상 최대공약수로 먼저 묶어낼 것!</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentAnswer = "";
    let currentType = "";
    let currentDifficulty = "normal";

    function getGCD(a, b) {
        return b ? getGCD(b, a % b) : Math.abs(a);
    }

    function formatTerm(num) {
        return num > 0 ? `+ ${num}` : `- ${Math.abs(num)}`;
    }

    function startGame(difficulty) {
        currentDifficulty = difficulty;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        let levelName = "";
        switch(difficulty) {
            case 'easy': levelName = "초보자"; break;
            case 'normal': levelName = "숙련자"; break;
            case 'hard': levelName = "고수"; break;
            case 'master': levelName = "마스터"; break;
            case 'grandmaster': levelName = "그랜드마스터"; break;
        }
        
        document.getElementById('game-title').innerHTML = `🎡 Level: ${levelName}`;
        generateProblem();
    }

    function goBack() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }

    function generateProblem() {
        const area = document.getElementById('answer-area');
        area.classList.remove('show'); 
        
        let k = 1; 
        let type = 1; 
        
        if (currentDifficulty === 'easy') {
            k = 1; type = 1; 
        } else if (currentDifficulty === 'normal') {
            k = Math.random() > 0.8 ? 2 : 1; 
            type = Math.random() > 0.6 ? 1 : 0; 
        } else if (currentDifficulty === 'hard') {
            k = Math.random() > 0.6 ? Math.floor(Math.random() * 2) + 2 : 1; 
            type = 2; 
        } else if (currentDifficulty === 'master') {
            k = Math.random() > 0.5 ? Math.floor(Math.random() * 3) + 2 : 1; 
            type = Math.floor(Math.random() * 2); 
        } else if (currentDifficulty === 'grandmaster') {
            k = Math.random() > 0.7 ? 2 : 1; 
            type = 3; 
        }
        
        let a, b, c, innerAns, typeName;
        
        if (type === 0) { 
            if (Math.random() > 0.5) { 
                let r = Math.floor(Math.random() * 9) + 2; 
                a = k; b = 0; c = -k * (r * r);
                innerAns = `(x - ${r})(x + ${r})`;
                typeName = k > 1 ? `공통인수 ${k} + 합차 공식` : "합차 공식";
            } else { 
                let r = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
                a = k; b = 2 * k * r; c = k * (r * r);
                innerAns = `(x ${formatTerm(r)})²`;
                typeName = k > 1 ? `공통인수 ${k} + 완전제곱식` : "완전제곱식";
            }
        } 
        else if (type === 1) { 
            let n = 0, q = 0;
            let range = currentDifficulty === 'easy' ? 6 : 10;
            while(n === 0) n = Math.floor(Math.random() * range) - Math.floor(range/2);
            while(q === 0 || q === n) q = Math.floor(Math.random() * range) - Math.floor(range/2);
            
            a = k; b = k * (n + q); c = k * (n * q);
            innerAns = `(x ${formatTerm(n)})(x ${formatTerm(q)})`;
            typeName = k > 1 ? `공통인수 ${k} + 기본 이차식` : "기본 이차식 (x² 계수 1)";
        } 
        else if (type === 2) { 
            let m = Math.floor(Math.random() * 2) + 2; 
            let p = 1; 
            let n = 0, q = 0;
            
            while(n === 0 || getGCD(m, Math.abs(n)) > 1) {
                n = Math.floor(Math.random() * 7) - 3;
            }
            while(q === 0) q = Math.floor(Math.random() * 7) - 3;
            
            a = k * m * p; b = k * (m * q + n * p); c = k * n * q;
            innerAns = `(${m}x ${formatTerm(n)})(x ${formatTerm(q)})`;
            typeName = k > 1 ? `공통인수 ${k} + 심화 이차식 (멜빵법)` : "심화 이차식 (멜빵법)";
        }
        else { 
            let a_val, b_val;
            let seed = Math.floor(Math.random() * 3);
            if (seed === 0) { a_val = 3; b_val = 2; }
            else if (seed === 1) { a_val = 4; b_val = 2; }
            else { a_val = 1; b_val = 1; }
            
            a = k; 
            b = k * (2 * a_val - b_val * b_val); 
            c = k * a_val * a_val; 
            
            innerAns = `(x² ${formatTerm(b_val)}x + ${a_val})(x² ${formatTerm(-b_val)}x + ${a_val})`;
            typeName = k > 1 ? `공통인수 ${k} + 복이차식 완제-합차 변형` : "복이차식 (완제-합차 변형)";
        }

        let pStr;
        if (type === 3) { 
            pStr = (a === 1) ? "x⁴" : a + "x⁴";
            if (b !== 0) {
                let sign = b > 0 ? " + " : " - ";
                let val = Math.abs(b) === 1 ? "" : Math.abs(b);
                pStr += sign + val + "x²";
            }
        } else { 
            pStr = (a === 1) ? "x²" : a + "x²";
            if (b !== 0) {
                let sign = b > 0 ? " + " : " - ";
                let val = Math.abs(b) === 1 ? "" : Math.abs(b);
                pStr += sign + val + "x";
            }
        }
        if (c !== 0) {
            pStr += (c > 0 ? " + " : " - ") + Math.abs(c);
        }

        setTimeout(() => {
            document.getElementById('problem').innerHTML = pStr;
            currentAnswer = (k > 1) ? `${k}${innerAns}` : innerAns;
            currentType = typeName;
        }, 150);
    }

    function toggleAnswer() {
        const area = document.getElementById('answer-area');
        if (!area.classList.contains('show')) {
            document.getElementById('type-text').innerText = currentType;
            document.getElementById('answer-display').innerText = currentAnswer;
            area.classList.add('show');
        } else {
            area.classList.remove('show');
        }
    }
</script>

</body>
</html>
